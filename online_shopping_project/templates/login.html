{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-art"><span class="eyebrow">WELCOME BACK</span><h2>Your next favourite<br>is waiting.</h2><div class="auth-art-shape">S</div><p>Pick up where you left off and keep discovering.</p></div><div class="auth-panel"><span class="eyebrow">YOUR ACCOUNT</span><h1>Log in.</h1><p class="muted">Welcome back to ShopEase.</p><form method="post" class="form-stack"><label>Email address<input type="email" name="email" placeholder="you@example.com" required autocomplete="email"></label><label>Password<input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"></label><button class="btn btn-primary btn-full" type="submit">Log in <span>→</span></button></form><p class="auth-switch">New to ShopEase? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>
{% endblock %}
