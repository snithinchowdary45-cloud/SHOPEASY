{% extends "base.html" %}
{% block title %}{{ 'Edit product' if product else 'Add product' }}{% endblock %}
{% block content %}
<div class="page-heading"><span class="eyebrow">INVENTORY</span><h1>{{ 'Edit product.' if product else 'Add a new product.' }}</h1><p>Keep product information and stock up to date.</p></div>
<form method="post" class="form-card product-edit-form"><div class="form-stack"><label>Product name<input name="name" required maxlength="150" value="{{ product.name if product else '' }}"></label><label>Description<textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label><div class="form-two"><label>Category<input name="category" required value="{{ product.category if product else 'General' }}"></label><label>Price (₹)<input name="price" type="number" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label></div><div class="form-two"><label>Stock quantity<input name="stock" type="number" min="0" step="1" required value="{{ product.stock if product else '0' }}"></label><label>Image URL<input name="image_url" type="url" placeholder="https://..." value="{{ product.image_url if product else '' }}"></label></div><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('admin') }}">Cancel</a><button class="btn btn-primary" type="submit">Save product <span>→</span></button></div></div></form>
{% endblock %}
